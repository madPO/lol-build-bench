syntax = "proto3";

package health;
option go_package = "src/backend/routes/health";

// The health service definition.
service Health {
  // Check health status.
  rpc Check (HealthCheckRequest) returns (HealthCheckResponse);
}

// The request message containing no parameters.
message HealthCheckRequest {}

// The response message containing the health status.
message HealthCheckResponse {
  string status = 1;
}